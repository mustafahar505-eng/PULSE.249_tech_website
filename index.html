T PowerFactory, ETAP, Python). Er hält einen M.Tech. in Power System Engineering (IIT Roorkee), einen MSc (Central South University) und einen B.Eng. (Al-Zaiem Al-Azhari University) und ist aktives Mitglied von IEEE PES und CIGRE Canada.")});
